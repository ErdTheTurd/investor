# Fetches Yahoo Finance bars/quotes into static JSON for GitHub Pages.
# No secrets — Yahoo chart API is keyless.
#
# After this lands on main, each successful run commits updated files under
# market-data/ and public/market-data/, which Pages serves from the repo root.
# That is intentional: Pages currently deploys from main's root, so committing
# data is the simplest path that needs no repo-settings change.

name: Fetch market data

on:
  schedule:
    # US equity session-ish (Eastern): pre-open, mid-morning, afternoon, after close.
    # Cron is UTC: 13:30, 15:30, 18:30, 21:15 ≈ 8:30 / 10:30 / 13:30 / 16:15 ET (EST+5).
    # During EDT these land one hour earlier local; still covers the trading day.
    - cron: '30 13 * * 1-5'
    - cron: '30 15 * * 1-5'
    - cron: '30 18 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Yahoo → static JSON
        run: node scripts/fetch-market-data.mjs

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data public/market-data
          if git diff --staged --quiet; then
            echo "No market-data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Yahoo market-data snapshot"
          git push
